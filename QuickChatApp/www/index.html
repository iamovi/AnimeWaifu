<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickChat</title>
    <link rel="preload" href="preloader.gif" as="image" />
    <link rel="icon" href="icon.png">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        .preloader {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(22, 24, 23);
            z-index: 10;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
    </style>
</head>
<body>
    <div class="preloader" id="preloader">
        <img src="preloader.gif" alt="Loading...">
    </div>
    <iframe id="dynamic-iframe"></iframe>
    <script>
        var script = document.createElement('script');
        script.src = 'https://iamovi.github.io/QuickChat/iframe.js?v=' + new Date().getTime();
        document.head.appendChild(script);
    </script>    
</body>
</html>
